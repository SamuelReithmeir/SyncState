name: Publish NuGet Packages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**/*.csproj'
      - 'Directory.Build.props'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - SyncState.Abstractions
          - SyncState.Core
          - SyncState.EntityFrameworkCore
          - SyncState.ErrorHandling
          - SyncState.OptionsMonitor
          - SyncState.ReloadInterval
          - SyncState.SignalR
          - SyncState.StateDeltas
          - SyncState.Diagnostics

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Get version from Directory.Build.props
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -oP '<VersionPrefix>\K[^<]+' Directory.Build.props)
          SUFFIX=$(grep -oP '<VersionSuffix>\K[^<]*' Directory.Build.props)
          if [ -z "$SUFFIX" ]; then
            FULL_VERSION=$VERSION
          else
            FULL_VERSION=$VERSION-$SUFFIX
          fi
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $FULL_VERSION"

      - name: Check if package already exists on NuGet.org
        id: check-package
        shell: bash
        run: |
          PACKAGE_NAME="${{ matrix.project }}"
          VERSION="${{ steps.get-version.outputs.version }}"
          
          # Query NuGet.org API to check if this exact version exists
          RESPONSE=$(curl -s "https://api.nuget.org/v3-flatcontainer/${PACKAGE_NAME,,}/index.json" || echo "{}")
          
          if echo "$RESPONSE" | grep -q "\"$VERSION\""; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Package $PACKAGE_NAME version $VERSION already exists on NuGet.org"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Package $PACKAGE_NAME version $VERSION does not exist, will publish"
          fi

      - name: Build project
        if: steps.check-package.outputs.exists == 'false'
        run: dotnet build src/${{ matrix.project }}/${{ matrix.project }}.csproj -c Release --no-restore

      - name: Pack NuGet package
        if: steps.check-package.outputs.exists == 'false'
        run: |
          dotnet pack src/${{ matrix.project }}/${{ matrix.project }}.csproj \
            -c Release \
            --no-build \
            -o ./nupkg

      - name: Upload NuGet package as artifact
        if: steps.check-package.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ matrix.project }}
          path: ./nupkg/*.nupkg
          retention-days: 30

      - name: Publish to NuGet.org
        if: steps.check-package.outputs.exists == 'false'
        shell: bash
        run: |
          set -x

          push_via_dotnet() {
            local FILE="$1"
            dotnet nuget push "$FILE" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate \
              --force-english-output
          }

          # Fallback: push the raw .nupkg directly via the legacy v2 push endpoint.
          # Proven to succeed even in cases where `dotnet nuget push` intermittently
          # gets a 500 from NuGet.org (likely due to how the .NET HttpClient
          # negotiates the request vs. NuGet.org's Front Door edge for that endpoint).
          push_via_curl() {
            local FILE="$1"
            local STATUS
            STATUS=$(curl -sS -o /tmp/nuget-push-response.txt -w "%{http_code}" \
              -X PUT \
              -H "X-NuGet-ApiKey: ${NUGET_API_KEY}" \
              -H "X-NuGet-Client-Version: 6.0.0" \
              -F "package=@${FILE}" \
              https://www.nuget.org/api/v2/package/)

            echo "curl push HTTP status: $STATUS"
            cat /tmp/nuget-push-response.txt

            # 200/201 = created, 409 = already exists (treat as success, mirrors --skip-duplicate)
            [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "409" ]
          }

          FILE=$(ls ./nupkg/*.nupkg | head -n 1)
          MAX_ATTEMPTS=3

          DOTNET_SUCCESS=false
          ATTEMPT=1
          DELAY=15
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            if push_via_dotnet "$FILE"; then
              DOTNET_SUCCESS=true
              break
            fi
            echo "dotnet nuget push attempt $ATTEMPT failed."
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Retrying in ${DELAY}s..."
              sleep $DELAY
            fi
            ATTEMPT=$((ATTEMPT + 1))
            DELAY=$((DELAY * 2))
          done

          if [ "$DOTNET_SUCCESS" != "true" ]; then
            echo "::warning::dotnet nuget push failed after $MAX_ATTEMPTS attempts. Falling back to raw curl push..."

            CURL_SUCCESS=false
            ATTEMPT=1
            DELAY=15
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              if push_via_curl "$FILE"; then
                CURL_SUCCESS=true
                break
              fi
              echo "curl push attempt $ATTEMPT failed."
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Retrying in ${DELAY}s..."
                sleep $DELAY
              fi
              ATTEMPT=$((ATTEMPT + 1))
              DELAY=$((DELAY * 2))
            done

            if [ "$CURL_SUCCESS" != "true" ]; then
              echo "::error::Both dotnet nuget push and curl fallback failed after retries."
              exit 1
            fi
          fi
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Skip publishing (package already exists)
        if: steps.check-package.outputs.exists == 'true'
        run: echo "Package ${{ matrix.project }} version ${{ steps.get-version.outputs.version }} already exists on NuGet.org. Skipping publication."

