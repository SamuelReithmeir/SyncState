name: License Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Validate dependency licenses are MIT
        run: ./scripts/check-licenses.sh
